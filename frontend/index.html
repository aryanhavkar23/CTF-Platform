<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWASP CTF Platform — Auth Verification Panel</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f293d;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 24px;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-logo {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      color: #000;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 14px;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .status-badge {
      font-size: 12px;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .status-badge.online { border-color: var(--accent-green); color: var(--accent-green); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }
    .card-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-family: var(--font-mono);
    }
    input {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent-cyan); }
    button {
      background: var(--accent-cyan);
      color: #0b0f19;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      font-family: var(--font-mono);
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.btn-green { background: var(--accent-green); }
    button.btn-purple { background: var(--accent-purple); color: #fff; }
    button.btn-red { background: var(--accent-red); color: #fff; }
    button.btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    button.btn-outline:hover { background: #1e293b; }
    
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    
    .terminal-card {
      background: #050811;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--font-mono);
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 10px;
      border-bottom: 1px solid #1a2234;
      padding-bottom: 8px;
    }
    pre {
      font-size: 13px;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 280px;
    }
    
    .user-pill {
      background: #0d1322;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .role-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
    }
    .role-student { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .role-moderator { background: rgba(6, 182, 212, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .role-admin { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge-logo">OWASP</div>
      <h1>CTF Platform &mdash; Authentication &amp; RBAC Verification</h1>
    </div>
    <div id="healthBadge" class="status-badge">Checking API...</div>
  </header>

  <div class="grid">
    <!-- Register Card -->
    <div class="card">
      <div class="card-title">1. Register Student</div>
      <form id="registerForm">
        <div class="form-group">
          <label>USERNAME</label>
          <input type="text" id="regUsername" required placeholder="hacker123" pattern="^[a-zA-Z0-9_-]+$" />
        </div>
        <div class="form-group">
          <label>EMAIL</label>
          <input type="email" id="regEmail" required placeholder="student@college.edu" />
        </div>
        <div class="form-group">
          <label>PASSWORD (min 8 chars)</label>
          <input type="password" id="regPassword" required minlength="8" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label>COLLEGE (optional)</label>
          <input type="text" id="regCollege" placeholder="OWASP University" />
        </div>
        <button type="submit" class="btn-green">Register User</button>
      </form>
    </div>

    <!-- Login Card -->
    <div class="card">
      <div class="card-title">2. Authenticate / Login</div>
      <form id="loginForm">
        <div class="form-group">
          <label>EMAIL</label>
          <input type="email" id="loginEmail" required placeholder="student@college.edu" />
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit">Login &amp; Store JWT</button>
      </form>
      <div style="margin-top: 16px;">
        <button id="logoutBtn" class="btn-outline">Clear Stored Session (Logout)</button>
      </div>
    </div>

    <!-- Auth State & RBAC Probes Card -->
    <div class="card">
      <div class="card-title">3. RBAC &amp; Session Probes</div>
      <div id="authState" class="user-pill">
        No active session. Please log in or register.
      </div>

      <div class="actions-grid">
        <button id="btnMe" class="btn-outline">GET /api/auth/me</button>
        <button id="btnTestStudent" class="btn-outline">Probe Student</button>
        <button id="btnTestMod" class="btn-purple">Probe Moderator</button>
        <button id="btnTestAdmin" class="btn-red">Probe Admin</button>
      </div>
    </div>
  </div>

  <!-- Live Response Inspector -->
  <div class="terminal-card">
    <div class="terminal-header">
      <span id="responseStatus">LIVE API RESPONSE INSPECTOR</span>
      <span id="responseTimestamp">Ready</span>
    </div>
    <pre id="responseLog">// Execute an operation above to inspect HTTP status, headers, and payload.</pre>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let currentToken = localStorage.getItem('owasp_jwt') || '';

    function logResponse(status, method, url, data) {
      document.getElementById('responseStatus').textContent = `${method} ${url} → HTTP ${status}`;
      document.getElementById('responseTimestamp').textContent = new Date().toLocaleTimeString();
      document.getElementById('responseLog').textContent = JSON.stringify(data, null, 2);
    }

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        const data = await res.json();
        const badge = document.getElementById('healthBadge');
        if (data.status === 'healthy') {
          badge.textContent = 'API ONLINE (Postgres Ready)';
          badge.classList.add('online');
        }
      } catch (e) {
        document.getElementById('healthBadge').textContent = 'API OFFLINE';
      }
    }

    function updateSessionUI(user) {
      const container = document.getElementById('authState');
      if (!user) {
        container.innerHTML = `<em>No active session. Please log in.</em>`;
        return;
      }
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${user.username}</strong>
          <span class="role-badge role-${user.role}">${user.role}</span>
        </div>
        <div style="color:var(--text-muted); font-size:11px; margin-top:4px;">${user.email}</div>
        <div style="color:var(--text-muted); font-size:11px;">College: ${user.college || 'N/A'}</div>
      `;
    }

    async function fetchMe() {
      if (!currentToken) {
        updateSessionUI(null);
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const data = await res.json();
        if (res.ok) {
          updateSessionUI(data);
        } else {
          updateSessionUI(null);
        }
        return { res, data };
      } catch (e) {
        updateSessionUI(null);
      }
    }

    // Register Handler
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        username: document.getElementById('regUsername').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        college: document.getElementById('regCollege').value.trim() || null
      };

      const res = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      logResponse(res.status, 'POST', '/api/auth/register', data);
    });

    // Login Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value
      };

      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      logResponse(res.status, 'POST', '/api/auth/login', data);

      if (res.ok && data.access_token) {
        currentToken = data.access_token;
        localStorage.setItem('owasp_jwt', currentToken);
        updateSessionUI(data.user);
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentToken = '';
      localStorage.removeItem('owasp_jwt');
      updateSessionUI(null);
      logResponse(200, 'LOCAL', 'session/clear', { message: 'JWT cleared from client storage' });
    });

    // Probe Buttons
    document.getElementById('btnMe').addEventListener('click', async () => {
      const result = await fetchMe();
      if (result) logResponse(result.res.status, 'GET', '/api/auth/me', result.data);
      else logResponse(401, 'GET', '/api/auth/me', { detail: 'Missing token in client storage' });
    });

    async function probeRoute(endpoint) {
      const headers = currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {};
      const res = await fetch(`${API_BASE}${endpoint}`, { headers });
      const data = await res.json();
      logResponse(res.status, 'GET', endpoint, data);
    }

    document.getElementById('btnTestStudent').addEventListener('click', () => probeRoute('/api/auth/test/student'));
    document.getElementById('btnTestMod').addEventListener('click', () => probeRoute('/api/auth/test/moderator'));
    document.getElementById('btnTestAdmin').addEventListener('click', () => probeRoute('/api/auth/test/admin'));

    // Startup
    checkHealth();
    fetchMe();
  </script>
</body>
</html>
